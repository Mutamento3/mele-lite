# Mele Host（10-04）：数据库 + 主程序 + Caddy（自动 HTTPS）。配置在同目录 .env（安装脚本生成）。
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mele
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mele
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mele -d mele"]
      interval: 5s
      retries: 20

  mele:
    image: ${MELE_IMAGE:-ghcr.io/aporia-and-poros/mele-host:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEWAPP_DSN: postgresql://mele:${DB_PASSWORD}@db:5432/mele
      NEWAPP_MASTER_KEY: ${MASTER_KEY}
      NEWAPP_SECRET: ${SECRET}
      NEWAPP_PUBLIC_URL: https://${MELE_DOMAIN}
      NEWAPP_HOST: "1"
      NEWAPP_RERANK: ${RERANK:-0}
    volumes:
      - data:/data

  # 记忆库（10-16，可选）：`mele-host memory on` 才起（.env 里 COMPOSE_PROFILES=memory）。跟 Host 共用 db（库名 mele_memory）
  # 和 Host 已经下好的 bge-m3（挂 Host 的 data 卷，HF_HOME 指过去），不对外开端口——只有 Host 在 http://memory:8765/mcp 连它
  memory:
    image: ${MELE_MEMORY_IMAGE:-ghcr.io/aporia-and-poros/mele-memory:latest}
    profiles: ["memory"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MEMORY_DSN: postgresql://mele:${DB_PASSWORD}@db:5432/mele_memory
      MELE_MEMORY_TOKEN: ${MELE_MEMORY_TOKEN:-}
      MELE_MEMORY_DATA: /memory
      MELE_MEMORY_TZ: ${MELE_MEMORY_TZ:-UTC}
      MELE_MEMORY_USER_NAME: ${MELE_MEMORY_USER_NAME:-}
      HF_HOME: /hostdata/hf
    volumes:
      - memory:/memory
      - data:/hostdata

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [mele]
    # 隧道模式（10-17，`mele-host tunnel on`）：.env 里 MELE_SITE=:80、端口只绑本机 127.0.0.1:8080，不占 80/443、不签证书
    ports:
      - "${MELE_HTTP_PORT:-80}:80"
      - "${MELE_HTTPS_PORT:-443}:443"
    environment:
      MELE_SITE: ${MELE_SITE:-${MELE_DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  db:
  data:
  caddy:
  memory:
