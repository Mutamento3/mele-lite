# 公开仓库里 server/ 有改动、或者手动点，就打 x86 + arm 两种镜像推到 GHCR（Mele Host 用）
name: host-image
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/host-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "BUILD=$(TZ=Asia/Singapore date +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"   # 版本戳（按新加坡日期，跟 What to Test / App 里的 minHostBuild 同一个日历）
      - uses: docker/build-push-action@v6
        with:
          context: server
          build-args: BUILD=${{ env.BUILD }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/aporia-and-poros/mele-host:latest
            ghcr.io/aporia-and-poros/mele-host:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
